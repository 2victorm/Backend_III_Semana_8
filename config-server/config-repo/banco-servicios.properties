# ============================================================
# Configuracion de banco-servicios.
# ============================================================

server.port=8080

# ---------- HTTPS/TLS ----------
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore-servicios.p12
server.ssl.key-store-password=bancoxyz2026
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=banco-servicios

# ---------- Base de datos ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/banco_xyz}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:hola123}
spring.datasource.driver-class-name=org.postgresql.Driver
# Semana 7: se crea la tabla propia de la Saga (solicitudes_retiro).
# Solo corre schema-retiros.sql (IF NOT EXISTS), no toca las tablas migradas.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-retiros.sql
spring.sql.init.continue-on-error=false

# ---------- HikariCP (pool de conexiones) ----------
# connection-timeout bajo (3s en vez de los 30s por defecto) 
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.pool-name=BancoServiciosPool
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-test-query=SELECT 1

# ---------- Logging con ID de correlacion ----------
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-sin-id}] %logger{25} - %msg%n

# ---------- Eureka (Service Discovery) ----------
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka:eureka2026@localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.healthcheck.enabled=true

eureka.instance.secure-port-enabled=true
eureka.instance.non-secure-port-enabled=false
eureka.instance.secure-port=${server.port}
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents,retries,retryevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
# Si ActiveMQ cae, banco-servicios sigue atendiendo (guarda los retiros y los
# reenvia despues), por eso el broker no debe marcarlo DOWN en Eureka.
management.health.jms.enabled=false

# ---------- Resilience4j: Circuit Breaker sobre el acceso a BD ----------
resilience4j.circuitbreaker.instances.bancoServiciosDb.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.bancoServiciosDb.slidingWindowSize=10
resilience4j.circuitbreaker.instances.bancoServiciosDb.failureRateThreshold=50
resilience4j.circuitbreaker.instances.bancoServiciosDb.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.bancoServiciosDb.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.bancoServiciosDb.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.bancoServiciosDb.automaticTransitionFromOpenToHalfOpenEnabled=true

# ============================================================
# Semana 7: Mensajeria asincrona (JMS / ActiveMQ) - Saga de retiros
# ============================================================
spring.activemq.broker-url=${BROKER_URL:tcp://localhost:61616}
spring.activemq.user=admin
spring.activemq.password=admin

# ---------- Resilience4j: Retry + Circuit Breaker sobre el broker ----------
# Retry: 3 intentos con backoff exponencial (1s, 2s). No reintenta si el
# circuito ya esta abierto (CallNotPermittedException): falla al instante.
resilience4j.retry.instances.brokerJms.maxAttempts=3
resilience4j.retry.instances.brokerJms.waitDuration=1s
resilience4j.retry.instances.brokerJms.enableExponentialBackoff=true
resilience4j.retry.instances.brokerJms.exponentialBackoffMultiplier=2
resilience4j.retry.instances.brokerJms.ignoreExceptions=io.github.resilience4j.circuitbreaker.CallNotPermittedException

# Circuit Breaker: con 3 envios fallidos (un POST con sus 3 intentos) se abre
# y los siguientes POST no esperan: quedan REGISTRADOS al instante.
resilience4j.circuitbreaker.instances.brokerJms.registerHealthIndicator=false
resilience4j.circuitbreaker.instances.brokerJms.slidingWindowSize=6
resilience4j.circuitbreaker.instances.brokerJms.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.brokerJms.failureRateThreshold=50
resilience4j.circuitbreaker.instances.brokerJms.waitDurationInOpenState=20000
resilience4j.circuitbreaker.instances.brokerJms.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.brokerJms.automaticTransitionFromOpenToHalfOpenEnabled=true

# ---------- Reenvio de solicitudes que no alcanzaron a llegar al broker ----------
retiros.reenvio.intervalo-ms=15000
retiros.reenvio.antiguedad-minima-segundos=10

# OAuth 2.0: valida la firma, expiracion y emisor del token.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH_ISSUER:http://localhost:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH_JWKS:http://localhost:9000/oauth2/jwks}
