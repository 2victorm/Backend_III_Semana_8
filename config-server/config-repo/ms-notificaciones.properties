# ============================================================
# Configuracion de ms-notificaciones (Semana 7)
# ============================================================
server.port=8093

# ---------- ActiveMQ ----------
spring.activemq.broker-url=${BROKER_URL:tcp://localhost:61616}
spring.activemq.user=admin
spring.activemq.password=admin
# Los listeners de este servicio escuchan un TOPICO (publicacion-suscripcion)
spring.jms.pub-sub-domain=true

# ---------- Logging ----------
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [ms-notificaciones:${server.port}] [%X{correlationId:-sin-id}] %logger{25} - %msg%n

# ---------- Eureka ----------
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka:eureka2026@localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.healthcheck.enabled=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# OAuth 2.0: valida la firma, expiracion y emisor del token.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH_ISSUER:http://localhost:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH_JWKS:http://localhost:9000/oauth2/jwks}
