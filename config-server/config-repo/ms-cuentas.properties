# ============================================================
# Configuracion de ms-cuentas (Semana 7)
# ============================================================

# PUERTO permite levantar varias instancias.
# instancia 1: mvn spring-boot:run -> 8091
# instancia 2: mvn spring-boot:run -Dspring-boot.run.arguments=--PUERTO=8092
server.port=${PUERTO:8091}

# ---------- Base de datos (misma BD, tablas propias) ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/banco_xyz}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:hola123}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.pool-name=MsCuentasPool

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-cuentas.sql
spring.sql.init.continue-on-error=false

# ---------- ActiveMQ ----------
spring.activemq.broker-url=${BROKER_URL:tcp://localhost:61616}
spring.activemq.user=admin
spring.activemq.password=admin
cuentas.listener.concurrencia=2-4
cuentas.reentrega.maximo=8

# ---------- Logging: instancia + hilo + ID de correlacion ----------
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [ms-cuentas:${server.port}] [%thread] [%X{correlationId:-sin-id}] %logger{25} - %msg%n

# ---------- Eureka ----------
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka:eureka2026@localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.healthcheck.enabled=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# ---------- Resilience4j: Circuit Breaker sobre la BD ----------
resilience4j.circuitbreaker.instances.cuentasDb.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.cuentasDb.slidingWindowSize=10
resilience4j.circuitbreaker.instances.cuentasDb.minimumNumberOfCalls=4
resilience4j.circuitbreaker.instances.cuentasDb.failureRateThreshold=50
resilience4j.circuitbreaker.instances.cuentasDb.waitDurationInOpenState=15000
resilience4j.circuitbreaker.instances.cuentasDb.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.cuentasDb.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.cuentasDb.ignoreExceptions=org.springframework.dao.DuplicateKeyException

# OAuth 2.0: valida la firma, expiracion y emisor del token.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH_ISSUER:http://localhost:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH_JWKS:http://localhost:9000/oauth2/jwks}
