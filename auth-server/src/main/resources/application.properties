spring.application.name=auth-server
server.port=9000
spring.security.oauth2.authorizationserver.issuer=${OAUTH_ISSUER:http://localhost:9000}

# Cliente de prueba que representa una aplicacion de cajero.
spring.security.oauth2.authorizationserver.client.cajero.registration.client-id=cajero
spring.security.oauth2.authorizationserver.client.cajero.registration.client-secret={noop}${CAJERO_SECRET:cajero-demo-2026}
spring.security.oauth2.authorizationserver.client.cajero.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.cajero.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.cajero.registration.scopes=banco.read,banco.write
spring.security.oauth2.authorizationserver.client.cajero.token.access-token-time-to-live=30m

# Cliente sin permiso de escritura, para demostrar el error 403.
spring.security.oauth2.authorizationserver.client.consulta.registration.client-id=consulta
spring.security.oauth2.authorizationserver.client.consulta.registration.client-secret={noop}${CONSULTA_SECRET:consulta-demo-2026}
spring.security.oauth2.authorizationserver.client.consulta.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.consulta.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.consulta.registration.scopes=banco.read
spring.security.oauth2.authorizationserver.client.consulta.token.access-token-time-to-live=30m
